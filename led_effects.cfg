[led_effect twinkle]
frame_rate: 24
leds:
    neopixel:caselight
layers:
    twinkle .6 .02 multiply (0.8, 1.0, 1.0),(0.0, 0.8, 1.0),(0.0, 0.0, 1.0)
    static 0 0 top (0.1,0.1,0.1)

[led_effect umbilical_rainbow]
frame_rate: 24
autostart: true
leds:
    neopixel:umbilical
layers:
    gradient  0.3  1 add (0.3, 0.0, 0.0),(0.0, 0.3, 0.0),(0.0, 0.0, 0.3)